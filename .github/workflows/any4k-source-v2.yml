name: Any4K source acquisition v2

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/any4k-source-v2.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: python -m pip install -U requests

      - name: Check formats and download source
        shell: bash
        run: |
          mkdir -p any4k-output
          set -o pipefail
          python - <<'PY' 2>&1 | tee any4k-output/any4k.log
          from __future__ import annotations
          import json, re, uuid
          from pathlib import Path
          from typing import Any
          from urllib.parse import urlparse
          import requests

          VIDEO_URL = "https://www.youtube.com/watch?v=jRYFIV030Gg"
          OUT = Path("any4k-output")
          COMMON = {
              "lang": "zh",
              "country": "TW",
              "platform": "Web",
              "sysVer": "web-2026",
              "appVer": "1.0.0",
              "bundleId": "com.any4k.web",
              "deviceId": uuid.uuid4().hex,
          }
          session = requests.Session()
          session.headers.update({
              "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/150.0.0.0 Safari/537.36",
              "Accept-Language": "zh-TW,zh;q=0.9,en;q=0.8",
              "Origin": "https://any4k.com",
              "Referer": "https://any4k.com/",
          })

          def save(name: str, value: Any):
              (OUT / name).write_text(json.dumps(value, ensure_ascii=False, indent=2), encoding="utf-8")

          def walk(value: Any, path="root"):
              if isinstance(value, dict):
                  yield path, value
                  for key, child in value.items():
                      yield from walk(child, f"{path}.{key}")
              elif isinstance(value, list):
                  for index, child in enumerate(value):
                      yield from walk(child, f"{path}[{index}]")

          def num(value: Any) -> int:
              match = re.search(r"(\d{2,4})", str(value or ""))
              return int(match.group(1)) if match else 0

          check_payload = {"url": VIDEO_URL, **COMMON}
          check = session.post("https://api.any4k.com/v1/dlp/check", json=check_payload, timeout=(20, 240))
          print("CHECK", check.status_code, check.headers.get("content-type"), check.text[:15000])
          check.raise_for_status()
          info = check.json()
          save("check-response.json", info)
          if info.get("err_code") not in (None, 0):
              raise RuntimeError(f"Any4K check rejected request: {info}")

          formats = []
          for path, item in walk(info):
              if not isinstance(item, dict):
                  continue
              ident = item.get("id") or item.get("format") or item.get("format_id") or item.get("formatId") or item.get("itag")
              if ident is None:
                  continue
              height = num(item.get("height") or item.get("res_text") or item.get("resolution") or item.get("quality"))
              ext = str(item.get("ext") or item.get("container") or "").lower()
              vcodec = str(item.get("vcodec") or item.get("videoCodec") or "")
              acodec = str(item.get("acodec") or item.get("audioCodec") or "")
              is_video = height > 0 or vcodec not in ("", "none", "null") or ".download" in path
              if not is_video:
                  continue
              formats.append({
                  "path": path,
                  "id": str(ident),
                  "height": height,
                  "ext": ext,
                  "has_audio": acodec not in ("", "none", "null") or ".download" in path,
                  "raw": item,
              })
          save("format-candidates.json", formats)
          if not formats:
              raise RuntimeError("No usable video formats in Any4K response")
          choices = [x for x in formats if x["height"] == 0 or x["height"] <= 720] or formats
          choices.sort(key=lambda x: (x["has_audio"], x["ext"] == "mp4", min(x["height"] or 720, 720)), reverse=True)
          chosen = choices[0]
          save("chosen-format.json", chosen)
          print("CHOSEN", json.dumps(chosen, ensure_ascii=False)[:10000])

          dl_payload = {"url": VIDEO_URL, "format": chosen["id"], **COMMON}
          response = session.post("https://api.any4k.com/v1/dlp/download", json=dl_payload, stream=True, timeout=(20, 900), allow_redirects=True)
          print("DOWNLOAD", response.status_code, response.headers.get("content-type"), response.url)
          response.raise_for_status()
          content_type = (response.headers.get("content-type") or "").lower()
          if "json" in content_type or content_type.startswith("text/"):
              raw = response.content
              (OUT / "download-response.txt").write_bytes(raw)
              result = json.loads(raw)
              save("download-response.json", result)
              direct = None
              for _, item in walk(result):
                  if isinstance(item, dict):
                      for key in ("url", "download", "download_url", "downloadUrl", "file", "file_url", "fileUrl"):
                          value = item.get(key)
                          if isinstance(value, str) and value.startswith(("http://", "https://")):
                              direct = value
                              break
                  if direct:
                      break
              if not direct:
                  raise RuntimeError(f"No direct URL in download response: {result}")
              response.close()
              response = session.get(direct, stream=True, timeout=(20, 1200), allow_redirects=True)
              print("DIRECT", response.status_code, response.headers.get("content-type"), response.url)
              response.raise_for_status()

          suffix = Path(urlparse(response.url).path).suffix.lower()
          if suffix not in (".mp4", ".mkv", ".webm", ".mov"):
              suffix = ".mp4"
          output = OUT / f"source{suffix}"
          total = 0
          with output.open("wb") as handle:
              for chunk in response.iter_content(1024 * 1024):
                  if not chunk:
                      continue
                  handle.write(chunk)
                  total += len(chunk)
                  if total and total % (20 * 1024 * 1024) < len(chunk):
                      print(f"DOWNLOADED {total/1024/1024:.1f} MiB", flush=True)
          print("SAVED", output, total)
          if total < 100000:
              raise RuntimeError(f"Media too small: {total}")
          PY

      - name: Inspect result
        if: always()
        run: |
          find any4k-output -maxdepth 1 -type f -printf '%f %s bytes\n' || true
          tail -240 any4k-output/any4k.log || true

      - name: Upload source or diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jRYFIV030Gg-any4k-source-v2
          path: any4k-output/**
          compression-level: 0
          retention-days: 2
          if-no-files-found: warn
