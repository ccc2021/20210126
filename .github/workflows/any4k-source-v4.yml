name: Any4K source acquisition v4 polling

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/any4k-source-v4.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -U requests
      - name: Poll Any4K and acquire source
        shell: bash
        run: |
          mkdir -p any4k-v4
          set -o pipefail
          python - <<'PY' 2>&1 | tee any4k-v4/run.log
          import json, re, time, uuid
          from pathlib import Path
          from urllib.parse import urlparse
          import requests

          OUT = Path('any4k-v4')
          VIDEO = 'https://www.youtube.com/watch?v=jRYFIV030Gg'
          COMMON = {
              'lang': 'zh', 'country': 'TW', 'platform': 'Web',
              'sysVer': '1.0', 'appVer': '1.0.0',
              'bundleId': 'com.any4k.web', 'deviceId': uuid.uuid4().hex,
          }
          session = requests.Session()
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/150.0.0.0 Safari/537.36',
              'Accept-Language': 'zh-TW,zh;q=0.9,en;q=0.8',
              'Origin': 'https://any4k.com', 'Referer': 'https://any4k.com/',
          })

          def save(name, value):
              (OUT / name).write_text(json.dumps(value, ensure_ascii=False, indent=2), encoding='utf-8')

          def walk(value, path='root'):
              if isinstance(value, dict):
                  yield path, value
                  for key, child in value.items():
                      yield from walk(child, f'{path}.{key}')
              elif isinstance(value, list):
                  for index, child in enumerate(value):
                      yield from walk(child, f'{path}[{index}]')

          def has_formats(value):
              for _, item in walk(value):
                  if not isinstance(item, dict):
                      continue
                  for key in ('download', 'raw_video', 'raw_audio', 'formats'):
                      if isinstance(item.get(key), list) and item[key]:
                          return True
              return False

          payload = {'url': VIDEO, **COMMON}
          history = []
          info = None
          for attempt in range(1, 73):
              try:
                  response = session.post('https://api.any4k.com/v1/dlp/check', json=payload, timeout=(20, 240))
                  body = response.text
                  record = {'attempt': attempt, 'status': response.status_code, 'body': body[:12000]}
                  history.append(record)
                  print('CHECK', attempt, response.status_code, body[:2000], flush=True)
                  if response.ok:
                      candidate = response.json()
                      if candidate.get('err_code') in (None, 0) and has_formats(candidate):
                          info = candidate
                          break
              except Exception as exc:
                  history.append({'attempt': attempt, 'error': repr(exc)})
                  print('CHECK ERROR', attempt, repr(exc), flush=True)
              time.sleep(5)
          save('poll-history.json', history)
          if info is None:
              raise RuntimeError('Any4K did not return formats within the polling window')
          save('check-response.json', info)

          def number(value):
              match = re.search(r'(\d{2,4})', str(value or ''))
              return int(match.group(1)) if match else 0

          formats = []
          for path, item in walk(info):
              if not isinstance(item, dict):
                  continue
              ident = item.get('id') or item.get('format') or item.get('format_id') or item.get('formatId') or item.get('itag')
              if ident is None:
                  continue
              height = number(item.get('height') or item.get('res_text') or item.get('resolution') or item.get('quality'))
              ext = str(item.get('ext') or item.get('container') or '').lower()
              vcodec = str(item.get('vcodec') or item.get('videoCodec') or '')
              acodec = str(item.get('acodec') or item.get('audioCodec') or '')
              if height > 0 or vcodec not in ('', 'none', 'null') or '.download' in path:
                  formats.append({
                      'path': path, 'id': str(ident), 'height': height, 'ext': ext,
                      'has_audio': acodec not in ('', 'none', 'null') or '.download' in path,
                      'raw': item,
                  })
          save('formats.json', formats)
          if not formats:
              raise RuntimeError('Formats appeared but no usable video entries were recognized')
          eligible = [x for x in formats if x['height'] == 0 or x['height'] <= 720] or formats
          eligible.sort(key=lambda x: (x['has_audio'], x['ext'] == 'mp4', min(x['height'] or 720, 720)), reverse=True)
          chosen = eligible[0]
          save('chosen.json', chosen)
          print('CHOSEN', json.dumps(chosen, ensure_ascii=False)[:10000], flush=True)

          download_payload = {'url': VIDEO, 'format': chosen['id'], **COMMON}
          response = session.post('https://api.any4k.com/v1/dlp/download', json=download_payload, stream=True, timeout=(20, 1200), allow_redirects=True)
          print('DOWNLOAD', response.status_code, response.headers.get('content-type'), response.url, flush=True)
          response.raise_for_status()
          ctype = (response.headers.get('content-type') or '').lower()
          if 'json' in ctype or ctype.startswith('text/'):
              raw = response.content
              (OUT / 'download-response.txt').write_bytes(raw)
              result = json.loads(raw)
              save('download-response.json', result)
              direct = None
              for _, item in walk(result):
                  if isinstance(item, dict):
                      for key in ('url', 'download', 'download_url', 'downloadUrl', 'file', 'file_url', 'fileUrl'):
                          value = item.get(key)
                          if isinstance(value, str) and value.startswith(('http://', 'https://')):
                              direct = value
                              break
                  if direct:
                      break
              if not direct:
                  raise RuntimeError(f'No direct media URL in response: {result}')
              response.close()
              response = session.get(direct, stream=True, timeout=(20, 1500), allow_redirects=True)
              print('DIRECT', response.status_code, response.headers.get('content-type'), response.url, flush=True)
              response.raise_for_status()

          suffix = Path(urlparse(response.url).path).suffix.lower()
          if suffix not in ('.mp4', '.mkv', '.webm', '.mov'):
              suffix = '.mp4'
          output = OUT / ('source' + suffix)
          total = 0
          with output.open('wb') as handle:
              for chunk in response.iter_content(1024 * 1024):
                  if chunk:
                      handle.write(chunk)
                      total += len(chunk)
                      if total and total % (20 * 1024 * 1024) < len(chunk):
                          print(f'DOWNLOADED {total/1024/1024:.1f} MiB', flush=True)
          print('SAVED', output, total)
          if total < 100000:
              raise RuntimeError(f'Media too small: {total}')
          PY
      - name: Inspect
        if: always()
        run: |
          find any4k-v4 -maxdepth 1 -type f -printf '%f %s bytes\n' || true
          tail -300 any4k-v4/run.log || true
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jRYFIV030Gg-any4k-source-v4
          path: any4k-v4/**
          compression-level: 0
          retention-days: 2
          if-no-files-found: warn
