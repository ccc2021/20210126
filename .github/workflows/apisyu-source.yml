name: Apisyu browser source acquisition

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/apisyu-source.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -U selenium requests
      - name: Convert and download through Apisyu
        shell: bash
        run: |
          mkdir -p apisyu-output
          set -o pipefail
          python - <<'PY' 2>&1 | tee apisyu-output/run.log
          import json, os, re, time
          from pathlib import Path
          from urllib.parse import urlparse
          import requests
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By

          root = Path('apisyu-output').resolve()
          options = Options()
          options.add_argument('--headless=new')
          options.add_argument('--no-sandbox')
          options.add_argument('--disable-dev-shm-usage')
          options.add_argument('--window-size=1280,900')
          options.add_argument('--lang=en-US')
          options.add_argument('--disable-blink-features=AutomationControlled')
          options.add_argument('--user-agent=Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/150.0.0.0 Safari/537.36')
          options.add_experimental_option('excludeSwitches', ['enable-automation'])
          options.add_experimental_option('prefs', {
              'download.default_directory': str(root),
              'download.prompt_for_download': False,
              'download.directory_upgrade': True,
              'safebrowsing.enabled': True,
          })
          options.set_capability('goog:loggingPrefs', {'performance': 'ALL', 'browser': 'ALL'})
          driver = webdriver.Chrome(options=options)
          driver.execute_cdp_cmd('Page.setDownloadBehavior', {'behavior': 'allow', 'downloadPath': str(root)})
          page = 'https://apisyu.com/single/mp4/jRYFIV030Gg?video=720&lang=en'
          result = {'page': page, 'snapshots': [], 'network': [], 'browser': []}
          seen_urls = set()

          def collect(label):
              snapshot = {'label': label, 'url': driver.current_url, 'title': driver.title}
              try:
                  snapshot['text'] = driver.find_element(By.TAG_NAME, 'body').text[:5000]
                  snapshot['links'] = [
                      {'text': a.text[:200], 'href': a.get_attribute('href'), 'download': a.get_attribute('download')}
                      for a in driver.find_elements(By.TAG_NAME, 'a')
                  ]
                  snapshot['buttons'] = [
                      {'text': b.text[:200], 'id': b.get_attribute('id'), 'class': b.get_attribute('class')}
                      for b in driver.find_elements(By.TAG_NAME, 'button')
                  ]
                  snapshot['resources'] = driver.execute_script("return performance.getEntriesByType('resource').map(x=>x.name)")
              except Exception as exc:
                  snapshot['error'] = repr(exc)
              result['snapshots'].append(snapshot)
              for entry in driver.get_log('performance'):
                  try:
                      message = json.loads(entry['message'])['message']
                      params = message.get('params', {})
                      request = params.get('request', {})
                      response = params.get('response', {})
                      url = request.get('url') or response.get('url') or ''
                      if url and url not in seen_urls:
                          seen_urls.add(url)
                          if any(token in url.lower() for token in ('download', 'convert', 'api', 'googlevideo', '.mp4', 'videoplayback', 'media')):
                              result['network'].append({
                                  'method': message.get('method'), 'url': url,
                                  'request_headers': request.get('headers'),
                                  'response': response,
                              })
                  except Exception:
                      pass
              try:
                  result['browser'].extend(driver.get_log('browser'))
              except Exception:
                  pass

          driver.get(page)
          time.sleep(8)
          collect('initial')

          clicked = set()
          deadline = time.time() + 180
          success_file = None
          while time.time() < deadline:
              for element in driver.find_elements(By.CSS_SELECTOR, 'button, a, input[type=button], input[type=submit]'):
                  try:
                      text = ' '.join(filter(None, [element.text, element.get_attribute('value'), element.get_attribute('aria-label'), element.get_attribute('title')])).strip()
                      href = element.get_attribute('href') or ''
                      key = (text, href)
                      lower = (text + ' ' + href).lower()
                      if key in clicked:
                          continue
                      if any(word in lower for word in ('download', 'convert', 'start', '720', 'mp4')):
                          clicked.add(key)
                          print('CLICK', text[:300], href[:500], flush=True)
                          driver.execute_script('arguments[0].click()', element)
                          time.sleep(5)
                  except Exception as exc:
                      print('CLICK ERROR', repr(exc), flush=True)
              collect(f'poll-{int(180-(deadline-time.time()))}')
              files = [p for p in root.iterdir() if p.is_file() and not p.name.endswith(('.log', '.json', '.html', '.png', '.crdownload'))]
              files = [p for p in files if p.stat().st_size > 100000]
              if files:
                  success_file = max(files, key=lambda p: p.stat().st_size)
                  break
              time.sleep(5)

          driver.save_screenshot(str(root / 'page.png'))
          (root / 'page.html').write_text(driver.page_source, encoding='utf-8')
          cookies = driver.get_cookies()
          driver.quit()
          (root / 'probe.json').write_text(json.dumps(result, ensure_ascii=False, indent=2), encoding='utf-8')

          if success_file:
              target = root / ('source' + (success_file.suffix or '.mp4'))
              if success_file != target:
                  success_file.replace(target)
              print('BROWSER DOWNLOAD SUCCESS', target, target.stat().st_size)
              raise SystemExit(0)

          session = requests.Session()
          session.headers.update({'User-Agent': options.arguments[-1].split('=', 1)[-1], 'Referer': page})
          for cookie in cookies:
              session.cookies.set(cookie['name'], cookie['value'], domain=cookie.get('domain'))
          candidates = []
          for snap in result['snapshots']:
              for link in snap.get('links', []):
                  href = link.get('href') or ''
                  if href.startswith(('http://', 'https://')):
                      candidates.append(href)
          candidates.extend(item['url'] for item in result['network'])
          unique = []
          for url in candidates:
              lower = url.lower()
              if url not in unique and any(x in lower for x in ('googlevideo.com', 'videoplayback', '.mp4', '/download', 'cdn')):
                  unique.append(url)
          print('DIRECT CANDIDATES', len(unique))
          for index, url in enumerate(unique):
              try:
                  print('TRY DIRECT', index, url[:1000], flush=True)
                  response = session.get(url, stream=True, timeout=(20, 900), allow_redirects=True)
                  ctype = (response.headers.get('content-type') or '').lower()
                  print('DIRECT RESPONSE', response.status_code, ctype, response.url)
                  if not response.ok or ('text/html' in ctype and 'video' not in ctype):
                      continue
                  target = root / f'direct-{index}.mp4'
                  total = 0
                  with target.open('wb') as handle:
                      for chunk in response.iter_content(1024 * 1024):
                          if chunk:
                              handle.write(chunk)
                              total += len(chunk)
                  if total > 100000:
                      final = root / 'source.mp4'
                      target.replace(final)
                      print('DIRECT SUCCESS', final, total)
                      raise SystemExit(0)
                  target.unlink(missing_ok=True)
              except Exception as exc:
                  print('DIRECT ERROR', repr(exc), flush=True)
          raise RuntimeError('Apisyu did not expose or download a media file')
          PY
      - name: Inspect
        if: always()
        run: |
          find apisyu-output -maxdepth 1 -type f -printf '%f %s bytes\n' || true
          tail -300 apisyu-output/run.log || true
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jRYFIV030Gg-apisyu-source
          path: apisyu-output/**
          compression-level: 0
          retention-days: 2
          if-no-files-found: warn
