<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#153f37">
<meta name="description" content="ReadFresh 晨興閱讀、多語詩歌與個人筆記">
<title>ReadFresh</title>
<style>
:root{--bg:#f3f4ef;--paper:rgba(255,255,255,.84);--ink:#18231f;--muted:#6d7874;--line:rgba(24,69,59,.12);--brand:#174e44;--brand2:#2d7b6a;--soft:#e5eee9;--danger:#a7443b;--shadow:0 20px 60px rgba(22,55,47,.11);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Noto Sans KR",sans-serif;color:var(--ink);background:var(--bg)}
:root[data-theme=dark]{--bg:#0f1513;--paper:rgba(27,36,33,.92);--ink:#edf4f1;--muted:#a7b2ae;--line:rgba(255,255,255,.10);--brand:#6bc2ad;--brand2:#8dd4c3;--soft:#1d302b;--danger:#ef8b80;--shadow:0 20px 60px rgba(0,0,0,.32)}
*{box-sizing:border-box}html{min-height:100%}body{margin:0;min-height:100vh;background:radial-gradient(circle at 12% -5%,rgba(54,148,126,.18),transparent 33%),var(--bg)}button,input,select,textarea{font:inherit}button,a{touch-action:manipulation}.shell{max-width:760px;margin:auto;min-height:100vh;padding:calc(12px + env(safe-area-inset-top)) 16px calc(104px + env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between;align-items:center;padding:8px 2px 16px}.brand{display:flex;gap:11px;align-items:center}.mark{width:40px;height:40px;border-radius:14px;background:linear-gradient(145deg,var(--brand2),var(--brand));display:grid;place-items:center;color:white;font-weight:800;box-shadow:0 10px 25px rgba(23,78,68,.24)}.brand strong{display:block;font-size:21px;letter-spacing:-.03em}.brand span{display:block;color:var(--muted);font-size:11px;margin-top:2px}.status{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);padding:8px 11px;border:1px solid var(--line);border-radius:999px;background:var(--paper)}.dot{width:8px;height:8px;border-radius:50%;background:#d29a35}.dot.ok{background:#2aa276}.hero,.card{background:var(--paper);border:1px solid var(--line);box-shadow:var(--shadow);backdrop-filter:blur(18px)}.hero{padding:23px;border-radius:28px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--brand)}h1,h2,h3,p{margin-top:0}.hero h1{font-size:29px;line-height:1.18;letter-spacing:-.045em;margin:10px 0 8px}.muted{color:var(--muted);line-height:1.65}.section{margin-top:18px}.title-row{display:flex;justify-content:space-between;align-items:center;margin:0 4px 10px}.title-row h2{font-size:18px;margin:0}.card{border-radius:22px;padding:18px;margin-bottom:12px}.reading h2{font-size:22px;line-height:1.35}.meta{font-size:12px;color:var(--muted);line-height:1.6}.body{font-size:var(--reader-size,19px);line-height:var(--reader-line,1.9);white-space:pre-wrap;word-break:break-word}.body p{margin:0 0 1.15em}.body h3{font-size:1.03em;margin:1.35em 0 .55em;color:var(--brand)}.toolbar,.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.toolbar{padding-bottom:14px;margin-bottom:16px;border-bottom:1px solid var(--line)}.btn{border:0;border-radius:14px;padding:11px 14px;background:var(--brand);color:white;font-weight:750;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}.btn.secondary{background:var(--soft);color:var(--ink)}.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}.btn.danger{color:var(--danger)}.btn.small{padding:8px 11px;font-size:13px}.input{width:100%;border:1px solid var(--line);border-radius:15px;padding:13px 14px;background:rgba(255,255,255,.42);color:var(--ink);outline:none}.input:focus{border-color:var(--brand)}:root[data-theme=dark] .input{background:rgba(0,0,0,.16)}textarea.input{min-height:125px;resize:vertical}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.chips{display:flex;gap:8px;overflow:auto;padding:2px 0 10px;scrollbar-width:none}.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--paper);color:var(--muted);border-radius:999px;padding:9px 12px}.chip.active{background:var(--brand);color:white}.progress{height:7px;background:var(--soft);border-radius:999px;overflow:hidden}.progress span{display:block;height:100%;background:var(--brand);border-radius:inherit}.archive-item{width:100%;text-align:left;border:0;background:transparent;color:inherit;padding:0}.archive-item h2{font-size:18px;margin:4px 0}.empty{text-align:center;color:var(--muted);padding:36px 18px}.tabs{position:fixed;z-index:20;left:50%;bottom:calc(10px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(720px,calc(100% - 22px));display:grid;grid-template-columns:repeat(5,1fr);padding:7px;border:1px solid var(--line);border-radius:24px;background:rgba(250,252,250,.92);backdrop-filter:blur(24px);box-shadow:0 15px 45px rgba(0,0,0,.18)}:root[data-theme=dark] .tabs{background:rgba(18,25,22,.94)}.tab{border:0;background:transparent;color:var(--muted);border-radius:17px;padding:8px 2px;font-size:11px}.tab b{display:block;font-size:19px;font-weight:500;margin-bottom:2px}.tab.active{color:var(--brand);background:rgba(56,145,124,.13)}.hidden{display:none!important}.toast{position:fixed;z-index:30;left:50%;bottom:115px;transform:translate(-50%,16px);opacity:0;background:#17221f;color:white;border-radius:999px;padding:10px 15px;font-size:13px;pointer-events:none;transition:.22s}.toast.show{opacity:1;transform:translate(-50%,0)}audio{width:100%;margin-top:13px}iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:18px;margin-top:13px}.link-list{display:grid;gap:8px;margin-top:12px}.link-list a{color:var(--brand);text-decoration:none;padding:10px 12px;border:1px solid var(--line);border-radius:13px}.note-text{white-space:pre-wrap;line-height:1.7}.skeleton{height:112px;border-radius:22px;background:linear-gradient(90deg,rgba(127,127,127,.07),rgba(127,127,127,.18),rgba(127,127,127,.07));background-size:220% 100%;animation:sh 1.25s infinite}@keyframes sh{to{background-position:-220% 0}}@media(max-width:430px){.shell{padding-left:13px;padding-right:13px}.hero{padding:20px}.hero h1{font-size:27px}.grid2{grid-template-columns:1fr}.status span:last-child{display:none}}@media print{.tabs,.top,.toolbar,.btn{display:none!important}.shell{max-width:none;padding:0}.card,.hero{box-shadow:none;background:white;color:black}.body{font-size:14pt}}
</style>
</head>
<body>
<div class="shell"><header class="top"><div class="brand"><div class="mark">R</div><div><strong>ReadFresh</strong><span>晨興 · 詩歌 · 個人筆記</span></div></div><div class="status"><i id="dot" class="dot"></i><span id="sync">同步中</span></div></header><main id="app"><div class="skeleton"></div><div class="skeleton section"></div></main></div>
<nav class="tabs" aria-label="主要導覽"><button class="tab active" data-route="today"><b>◉</b>今日</button><button class="tab" data-route="archive"><b>▤</b>歷史</button><button class="tab" data-route="hymns"><b>♫</b>詩歌</button><button class="tab" data-route="notes"><b>✎</b>筆記</button><button class="tab" data-route="settings"><b>⚙</b>設定</button></nav><div id="toast" class="toast"></div>
<script>
(()=>{'use strict';
const API='https://jtjcfrdusahwutppyndf.supabase.co/functions/v1/readfresh-api';
const app=document.querySelector('#app'),dot=document.querySelector('#dot'),syncEl=document.querySelector('#sync');
const state={route:'today',readings:[],query:'',notes:load('rf3-notes',[]),progress:load('rf3-progress',{}),font:Number(localStorage.getItem('rf3-font')||19),line:Number(localStorage.getItem('rf3-line')||1.9),theme:localStorage.getItem('rf3-theme')||'system',hymn:null};
function load(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v??d}catch{return d}}function save(k,v){localStorage.setItem(k,JSON.stringify(v))}
function esc(v=''){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(t){const e=document.querySelector('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),1800)}
function setTheme(){const dark=state.theme==='dark'||(state.theme==='system'&&matchMedia('(prefers-color-scheme:dark)').matches);document.documentElement.dataset.theme=dark?'dark':'light';document.documentElement.style.setProperty('--reader-size',state.font+'px');document.documentElement.style.setProperty('--reader-line',state.line)}
function val(v){if(!v||typeof v!=='object')return null;if('stringValue'in v)return v.stringValue;if('integerValue'in v)return Number(v.integerValue);if('doubleValue'in v)return Number(v.doubleValue);if('booleanValue'in v)return v.booleanValue;if('timestampValue'in v)return v.timestampValue;if('arrayValue'in v)return(v.arrayValue.values||[]).map(val);if('mapValue'in v)return fields(v.mapValue.fields||{});return null}function fields(f){return Object.fromEntries(Object.entries(f||{}).map(([k,v])=>[k,val(v)]))}
function pageLines(pages){return(Array.isArray(pages)?pages:[]).flatMap(p=>Array.isArray(p?.context)?p.context:typeof p==='string'?[p]:[]).filter(Boolean)}
function normalize(x,i){const d=Array.isArray(x.day_messages)?x.day_messages:[];return{...x,id:String(x.id||x.section_number||i),section_number:x.section_number||`第 ${i+1} 週`,section_name:x.section_name||'本週信息',day_messages:d,outline:Array.isArray(x.outline)?x.outline:[]}}
function latest(){return state.readings[0]||null}function dayIndex(r){return Math.min(Math.max((new Date().getDay()||1)-1,0),Math.max(r.day_messages.length-1,0))}
function linesFor(r,i,outline=false){if(outline)return pageLines(r.outline);const d=r.day_messages[i]||{};if(Array.isArray(d.data))return pageLines(d.data);if(Array.isArray(d.context))return d.context;return[String(d.content||d.message||d.text||'')].filter(Boolean)}
function date(v){const d=new Date(v);return isNaN(d)?'':new Intl.DateTimeFormat('zh-TW',{month:'short',day:'numeric'}).format(d)}
function renderText(lines){return lines.length?lines.map(x=>{const s=String(x).trim(),h=/^(第.+[週篇]|週[一二三四五六日]|晨興餧養|信息選讀|壹|貳|叁|肆|伍|陸)/.test(s);return h?`<h3>${esc(s)}</h3>`:`<p>${esc(s)}</p>`}).join(''):'<div class="empty">尚無本文</div>'}
function renderToday(){const r=latest();if(!r)return`<div class="hero"><div class="eyebrow">TODAY</div><h1>尚未取得閱讀資料</h1><p class="muted">請稍後重新同步。</p></div>`;const i=dayIndex(r),d=r.day_messages[i]||{},key=`${r.id}:${i}`,done=!!state.progress[key],ratio=Math.round(Object.keys(state.progress).filter(k=>k.startsWith(r.id+':')&&state.progress[k]).length/Math.max(r.day_messages.length,1)*100);return`<section class="hero"><div class="eyebrow">TODAY · ${esc(r.section_number)}</div><h1>${esc(r.section_name||r.training_topic||'今日供應')}</h1><p class="muted">${esc(r.training_topic||r.training_name||'每日進入話中')}</p><div class="progress"><span style="width:${ratio}%"></span></div></section><section class="section card reading"><div class="toolbar"><button class="btn secondary small" data-font="-1">A−</button><button class="btn secondary small" data-font="1">A＋</button><button class="btn secondary small" data-speak>朗讀</button><button class="btn secondary small" data-new-note>筆記</button><button class="btn secondary small" onclick="print()">列印</button></div><h2>${esc(d.day||d.title||`第 ${i+1} 天`)}</h2><div class="meta">${esc(d.verses||'')} ${date(r.started_day)}－${date(r.ended_day)}</div><article class="body" id="readingBody">${renderText(linesFor(r,i))}</article><div class="row"><button class="btn" data-complete="${esc(key)}">${done?'✓ 已完成':'標記完成'}</button><button class="btn ghost" data-outline="${esc(r.id)}">查看綱目</button></div></section>`}
function renderArchive(){const q=state.query.toLowerCase(),list=state.readings.filter(r=>JSON.stringify(r).toLowerCase().includes(q));return`<section class="hero"><div class="eyebrow">ARCHIVE</div><h1>歷史信息</h1><input id="search" class="input" type="search" placeholder="搜尋週次、題目或內文" value="${esc(state.query)}"></section><section class="section">${list.length?list.map(r=>`<article class="card"><button class="archive-item" data-open="${esc(r.id)}"><div class="eyebrow">${esc(r.section_number)}</div><h2>${esc(r.section_name)}</h2><div class="meta">${esc(r.training_topic||r.training_name||'')}</div></button></article>`).join(''):'<div class="empty">沒有符合內容</div>'}</section>`}
function renderHymns(){const h=state.hymn;let result='';if(h){const media=h.embedUrl?`<iframe src="${esc(h.embedUrl)}" allow="autoplay;encrypted-media;picture-in-picture" allowfullscreen></iframe>`:h.audioUrl?`<audio controls preload="none" src="${esc(h.audioUrl)}"></audio>`:'';const links=[...(h.downloads||[]),...(h.related||[])].slice(0,12).map(x=>`<a target="_blank" rel="noopener" href="${esc(x.url)}">${esc(x.label||x.code||'開啟來源')}</a>`).join('');result=`<div class="card" style="margin-top:14px"><div class="eyebrow">${esc(h.code||h.lang||'HYMN')}</div><h2>${esc(h.title||'詩歌')}</h2>${media}<div class="link-list">${links}</div>${h.pageUrl?`<a class="btn ghost" target="_blank" rel="noopener" href="${esc(h.pageUrl)}">開啟原始頁面</a>`:''}</div>`}return`<section class="hero"><div class="eyebrow">HYMNS · REMOTE STREAM</div><h1>多國語詩歌</h1><p class="muted">影音直接由原始來源播放，不儲存在網站。</p></section><section class="section card"><div class="grid2"><select id="hlang" class="input"><option value="zh">繁體中文</option><option value="cn">简体中文</option><option value="en">English</option><option value="fr">Français</option><option value="de">Deutsch</option><option value="ko">한국어</option></select><input id="htype" class="input" value="ts" placeholder="類型：ts / ch / h"></div><input id="hnum" class="input" style="margin-top:10px" value="329" placeholder="詩歌編號"><input id="hsource" class="input hidden" style="margin-top:10px" placeholder="韓文歌名，或貼 YouTube／音訊網址"><button id="hgo" class="btn" style="width:100%;margin-top:10px">查找／播放</button>${result}</section>`}
function renderNotes(){return`<section class="hero"><div class="eyebrow">PERSONAL NOTES</div><h1>個人筆記</h1><textarea id="newnote" class="input" placeholder="記下今天所得著的亮光…"></textarea><button id="addnote" class="btn" style="margin-top:10px">儲存筆記</button></section><section class="section">${state.notes.length?state.notes.slice().reverse().map(n=>`<article class="card"><div class="note-text">${esc(n.text)}</div><div class="meta" style="margin-top:10px">${new Date(n.at).toLocaleString()}</div><button class="btn ghost danger small" style="margin-top:10px" data-delete="${esc(n.id)}">刪除</button></article>`).join(''):'<div class="empty">尚未建立筆記</div>'}</section>`}
function renderSettings(){return`<section class="hero"><div class="eyebrow">SETTINGS</div><h1>閱讀設定</h1><label class="meta">內文字級：<b>${state.font}px</b></label><input id="font" type="range" min="16" max="30" value="${state.font}" style="width:100%;margin:12px 0"><label class="meta">行距：<b>${state.line.toFixed(1)}</b></label><input id="line" type="range" min="1.5" max="2.4" step="0.1" value="${state.line}" style="width:100%;margin:12px 0"><select id="theme" class="input"><option value="system">跟隨系統</option><option value="light">淺色</option><option value="dark">深色</option></select><div class="row" style="margin-top:12px"><button id="export" class="btn secondary">匯出資料</button><button id="clear" class="btn ghost danger">清除本機資料</button></div></section><section class="section card"><h2>資料與隱私</h2><p class="muted">晨興資料來自原 ReadFresh Firestore。筆記、進度與偏好只保存在目前裝置；詩歌影音不會上傳或儲存。</p></section>`}
function render(){setTheme();app.innerHTML=state.route==='today'?renderToday():state.route==='archive'?renderArchive():state.route==='hymns'?renderHymns():state.route==='notes'?renderNotes():renderSettings();bind()}
function route(r){state.route=r;document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.route===r));render();scrollTo(0,0)}
function bind(){const search=document.querySelector('#search');if(search)search.oninput=e=>{state.query=e.target.value;render()};document.querySelectorAll('[data-complete]').forEach(b=>b.onclick=()=>{state.progress[b.dataset.complete]=!state.progress[b.dataset.complete];save('rf3-progress',state.progress);render();toast('閱讀進度已更新')});document.querySelectorAll('[data-font]').forEach(b=>b.onclick=()=>{state.font=Math.max(16,Math.min(30,state.font+Number(b.dataset.font)));localStorage.setItem('rf3-font',state.font);render()});const speak=document.querySelector('[data-speak]');if(speak)speak.onclick=()=>{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(document.querySelector('#readingBody')?.innerText||'');u.lang='zh-TW';speechSynthesis.speak(u)};document.querySelectorAll('[data-new-note]').forEach(b=>b.onclick=()=>route('notes'));document.querySelectorAll('[data-outline]').forEach(b=>b.onclick=()=>{const r=state.readings.find(x=>x.id===b.dataset.outline);if(r){app.innerHTML=`<section class="hero"><div class="eyebrow">${esc(r.section_number)}</div><h1>${esc(r.section_name)}</h1></section><section class="section card"><article class="body">${renderText(linesFor(r,0,true))}</article><button class="btn ghost" onclick="location.reload()">返回</button></section>`}});document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{const r=state.readings.find(x=>x.id===b.dataset.open);if(r){state.readings=[r,...state.readings.filter(x=>x.id!==r.id)];route('today')}});const add=document.querySelector('#addnote');if(add)add.onclick=()=>{const e=document.querySelector('#newnote'),v=e.value.trim();if(!v)return;state.notes.push({id:String(Date.now()),text:v,at:new Date().toISOString()});save('rf3-notes',state.notes);render();toast('筆記已儲存')};document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{state.notes=state.notes.filter(n=>n.id!==b.dataset.delete);save('rf3-notes',state.notes);render()});const lang=document.querySelector('#hlang'),source=document.querySelector('#hsource'),type=document.querySelector('#htype'),num=document.querySelector('#hnum');if(lang){lang.onchange=()=>{const ko=lang.value==='ko';source.classList.toggle('hidden',!ko);type.classList.toggle('hidden',ko);num.placeholder=ko?'韓文歌名或關鍵字':'詩歌編號'}}const hgo=document.querySelector('#hgo');if(hgo)hgo.onclick=async()=>{const l=lang.value,n=num.value.trim(),t=type.value.trim()||'ts';let src='';let q='';if(l==='ko'){if(/^https:\/\//i.test(source.value.trim()||n))src=source.value.trim()||n;else q=source.value.trim()||n||'한국어 찬송가'}const p=new URLSearchParams({lang:l,type:l==='ko'?'external':t,number:l==='ko'?'1':n});if(src)p.set('source_url',src);if(q)p.set('query',q);hgo.disabled=true;hgo.textContent='載入中…';try{const r=await fetch(`${API}/hymnal?${p}`);const j=await r.json();if(!r.ok)throw Error(j.error||r.status);state.hymn=j;render()}catch(e){toast('詩歌載入失敗：'+e.message)}finally{hgo.disabled=false}};const font=document.querySelector('#font');if(font)font.oninput=e=>{state.font=Number(e.target.value);localStorage.setItem('rf3-font',state.font);render()};const line=document.querySelector('#line');if(line)line.oninput=e=>{state.line=Number(e.target.value);localStorage.setItem('rf3-line',state.line);render()};const theme=document.querySelector('#theme');if(theme){theme.value=state.theme;theme.onchange=e=>{state.theme=e.target.value;localStorage.setItem('rf3-theme',state.theme);render()}}const exp=document.querySelector('#export');if(exp)exp.onclick=()=>{const blob=new Blob([JSON.stringify({notes:state.notes,progress:state.progress,settings:{font:state.font,line:state.line,theme:state.theme},exportedAt:new Date().toISOString()},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='readfresh-backup.json';a.click();URL.revokeObjectURL(a.href)};const clear=document.querySelector('#clear');if(clear)clear.onclick=()=>{if(confirm('確定清除筆記、進度與設定？')){Object.keys(localStorage).filter(k=>k.startsWith('rf3-')).forEach(k=>localStorage.removeItem(k));location.reload()}}}
async function sync(){try{const r=await fetch(`${API}/readings`,{headers:{accept:'application/json'}});if(!r.ok)throw Error(r.status);const j=await r.json();state.readings=(j.items||[]).map(normalize).sort((a,b)=>new Date(b.created_day||0)-new Date(a.created_day||0));if(!state.readings.length)throw Error('no data');localStorage.setItem('rf3-cache',JSON.stringify(state.readings));dot.classList.add('ok');syncEl.textContent='已同步'}catch(e){state.readings=load('rf3-cache',[]);syncEl.textContent=state.readings.length?'離線資料':'無法同步'}render()}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>route(t.dataset.route));setTheme();sync();
})();
</script>
</body>
</html>
